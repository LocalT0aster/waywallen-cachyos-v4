name: Update upstream releases

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: ./ci/setup-cachyos-repositories.sh
      - run: pacman -S --noconfirm --needed git github-cli pacman-contrib sudo
      - run: ./ci/checkout-repository.sh
      - name: Create package build user
        run: |
          useradd --create-home builder
          install -d -o builder -g builder /home/builder/.cargo
      - name: Restore package build caches
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/pacman/pkg
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: cachyos-v4-build-${{ hashFiles('packages/**/PKGBUILD', '.gitmodules') }}
          restore-keys: |
            cachyos-v4-build-
      - name: Authorize the update checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
      - run: |
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Update pinned submodules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-upstreams.sh
      - run: su builder -c 'cd "$GITHUB_WORKSPACE" && ./scripts/update-pkgbuilds.sh'
      - name: Import package signing key
        env:
          PACKAGER_GPG_PRIVATE_KEY: ${{ secrets.PACKAGER_GPG_PRIVATE_KEY }}
        run: |
          install -d -m 700 /home/builder/.gnupg
          chown builder:builder /home/builder/.gnupg
          printf '%s' "$PACKAGER_GPG_PRIVATE_KEY" | su builder -c 'gpg --batch --import'
      - run: |
          su builder -c 'cd "$GITHUB_WORKSPACE" && ./scripts/build-repository.sh'
      - name: Commit validated release updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .gitmodules upstream packages
          git diff --cached --quiet || git commit -m 'chore: update upstream package releases'
          git push
