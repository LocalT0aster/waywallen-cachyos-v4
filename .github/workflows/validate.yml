name: Validate packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - run: ./ci/setup-cachyos-repositories.sh
      - run: pacman -S --noconfirm --needed git github-cli
      - run: ./ci/checkout-repository.sh
      - name: Create package build user
        run: |
          useradd --create-home builder
          install -d -o builder -g builder /home/builder/.cargo
      - name: Restore package build caches
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/pacman/pkg
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: cachyos-v4-build-${{ hashFiles('packages/**/PKGBUILD', '.gitmodules') }}
          restore-keys: |
            cachyos-v4-build-
      - id: runner
        run: ./scripts/check-v4-runner.sh
      - name: Authorize package build user
        run: |
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Verify package sources and metadata
        run: |
          su builder -c 'for package in packages/*; do
            (cd "$package" && makepkg --verifysource && test -s .SRCINFO)
          done'
      - name: Build signed repository packages
        run: su builder -c 'cd "$GITHUB_WORKSPACE" && SIGN_PACKAGES=0 ./scripts/build-repository.sh'
      - name: Run v4 executable tests
        if: steps.runner.outputs.v4_supported == 'true'
        run: ./scripts/test-v4-packages.sh
