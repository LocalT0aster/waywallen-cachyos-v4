name: Validate packages

on:
  pull_request:
    paths:
      - '.github/actions/build-test/**'
      - '.github/workflows/**'
      - 'packages/**'
      - 'scripts/**'
      - 'upstream/**'
  push:
    branches: [main]
    paths:
      - '.github/actions/build-test/**'
      - '.github/workflows/**'
      - 'packages/**'
      - 'scripts/**'
      - 'upstream/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - id: build
        uses: ./.github/actions/build-test
        with:
          diff-base: ${{ github.event.before || github.event.pull_request.base.sha }}
      - name: Upload validated packages
        if: github.ref == 'refs/heads/main' && steps.build.outputs.packages != ''
        uses: actions/upload-artifact@v7
        with:
          name: validated-packages
          path: dist/x86_64/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1
