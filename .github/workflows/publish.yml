name: Publish pacman repository

on:
  workflow_run:
    workflows: [Validate packages]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: pacman -Sy --noconfirm
      - run: pacman -S --noconfirm --needed git
      - name: Download validated packages
        uses: actions/download-artifact@v8
        with:
          name: validated-packages
          path: dist/x86_64
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Import package signing key
        env:
          PACKAGER_GPG_PRIVATE_KEY: ${{ secrets.PACKAGER_GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$PACKAGER_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --with-colons --list-secret-keys B075783531075AA59D4911C7448DCEC4307C77A0 | grep -q "^sec:"
      - name: Sign repository packages
        run: |
          for package in dist/x86_64/*.pkg.tar.zst; do
            gpg --batch --yes --detach-sign "$package"
          done
          repo-add dist/x86_64/waywallen.db.tar.zst dist/x86_64/*.pkg.tar.zst
          gpg --batch --yes --detach-sign dist/x86_64/waywallen.db.tar.zst
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
