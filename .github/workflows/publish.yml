name: Publish pacman repository

on:
  workflow_run:
    workflows: [Update upstream releases]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pacman -S --noconfirm --needed git sudo
      - run: ./ci/checkout-repository.sh
      - name: Create package build user
        run: |
          useradd --create-home builder
          install -d -o builder -g builder /home/builder/.cargo
      - name: Restore package build caches
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /var/cache/pacman/pkg
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: arch-build-${{ hashFiles('packages/**/PKGBUILD', '.gitmodules') }}
          restore-keys: |
            arch-build-
      - name: Import package signing key
        env:
          PACKAGER_GPG_PRIVATE_KEY: ${{ secrets.PACKAGER_GPG_PRIVATE_KEY }}
        run: |
          install -d -m 700 /home/builder/.gnupg
          chown -R builder:builder /home/builder/.gnupg
          printf '%s' "$PACKAGER_GPG_PRIVATE_KEY" | su builder -c 'gpg --batch --import'
          su builder -c 'gpg --batch --with-colons --list-secret-keys B075783531075AA59D4911C7448DCEC4307C77A0 | grep -q "^sec:"'
      - run: ./ci/trust-package-signing-key.sh
      - run: |
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c 'cd "$GITHUB_WORKSPACE" && ./scripts/build-repository.sh'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Save package build caches
        if: always() && steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /var/cache/pacman/pkg
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
          key: ${{ steps.package-cache.outputs.cache-primary-key }}
