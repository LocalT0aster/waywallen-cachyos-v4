name: Build and test packages
description: Build and smoke-test the package suite in the caller workspace.

inputs:
  checkout:
    description: Recreate the repository after Checkout's Git-less fallback.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install build tools
      shell: bash
      run: pacman -Sy --noconfirm && pacman -S --noconfirm --needed git sudo
    - name: Recreate Git checkout
      if: inputs.checkout == 'true'
      shell: bash
      run: ./ci/checkout-repository.sh
    - name: Prepare package build user
      shell: bash
      run: ./ci/setup-build-user.sh
    - name: Calculate package cache key
      id: cache-key
      shell: bash
      run: |
        hash=$(for file in .gitmodules packages/*/PKGBUILD; do sha256sum "$file"; done | sha256sum | cut -d' ' -f1)
        printf 'value=%s\n' "$hash" >> "$GITHUB_OUTPUT"
    - name: Restore package build caches
      id: package-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          /var/cache/pacman/pkg
          /home/builder/.cargo/registry
          /home/builder/.cargo/git
          /home/builder/.cache/ccache
        key: arch-build-v3-${{ steps.cache-key.outputs.value }}
        restore-keys: |
          arch-build-v3-
    - name: Verify package sources and metadata
      shell: bash
      run: |
        su builder -c 'for package in packages/*; do
          (cd "$package" && makepkg --verifysource && test -s .SRCINFO)
        done'
    - name: Build repository packages
      shell: bash
      run: su builder -c 'cd "$GITHUB_WORKSPACE" && SIGN_PACKAGES=0 ./scripts/build-repository.sh'
    - name: Save package build caches
      if: steps.package-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          /var/cache/pacman/pkg
          /home/builder/.cargo/registry
          /home/builder/.cargo/git
          /home/builder/.cache/ccache
        key: arch-build-v3-${{ steps.cache-key.outputs.value }}
    - name: Run executable tests
      shell: bash
      run: ./scripts/test-packages.sh
